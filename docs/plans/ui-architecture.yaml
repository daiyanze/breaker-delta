goal: Build the UI foundation that ADR 0020 decides, so every page, desk tab, email and share card is made from one package
record: docs/adr/0020-ui-architecture.md
issues:
  - id: ui-tokens
    title: "@bd/ui package with the tokens layer"
    milestone: UI M0 Foundations
    depends_on: []
    what: |
      Create `packages/ui` (`@bd/ui`) with the `tokens` layer of ADR 0020,
      section 5, and move the token work out of
      `apps/web/src/core/style.ts` and `icon.ts` into it.

      - A generator writes `tokens.gen.ts` (literal-union types and values)
        from `design/system/tokens.json`.
      - Exports `colorOf`, `size`, `typeStyle`, `tokensCss`, `FONT_FILES` and
        `fontFaceCss`, with the signatures in the record.
      - `supplement.ts` holds the values the design states only in prose or
        not at all (control height, phone gutter and section size, the
        two-column breakpoint), each with its source. `PHONE` and
        `TWO_COLUMNS_FROM` move there from `style.ts`.
      - `tokensCss()` keeps today's output in this issue; `light-dark()`
        comes with `ui-css`.
      - `apps/web` imports from `@bd/ui/tokens`; `icon.ts` no longer reads
        `tokens.json` itself.
      - `scripts/check-deps.ts`: rules for the layers and areas of section
        3, a list of data files a rule may import from outside its package,
        and `@bd/ui` allowed in `apps/web`.
      - `packages/ui/README.md`: the layers, the import direction, where a
        new token or component goes.

      Protected path: `AGENTS.md` (the architecture map gains
      `packages/ui`; the known-gaps sentence about data files changes).
      Part of the check: `scripts/check-deps.ts`, `bun.lock` (a new
      workspace), `packages/ui/package.json` (`typecheck`) and
      `packages/ui/tsconfig.tokens.json`. Replaces the tokens half of #257.
    acceptance:
      - A snapshot of every page the site renders, recorded in a commit before the move, is byte-identical after it.
      - A test regenerates `tokens.gen.ts` and fails when it differs from the committed file.
      - "`check-deps` tests plant one violation per rule and each is reported: `@bd/ui` importing an app by name and by relative path, importing another package, importing a JSON file other than `tokens.json`, `tokens` importing `runtime`, `primitives` importing `patterns`."
      - "`grep -rn 'tokens.json' apps/web/src --include='*.ts' --exclude='*.test.ts'` prints nothing."
      - "`packages/ui/tsconfig.tokens.json` has no DOM lib and no Bun or Cloudflare types, and `bun run check` passes."

  - id: ui-css
    title: The stylesheet as CSS files and one linked file
    milestone: UI M0 Foundations
    depends_on: [ui-tokens]
    what: |
      ADR 0020, sections 4 and 11, for CSS. Pages are still built by
      `layout.ts`; only how styles are written and served changes.

      - The CSS in `style.ts` moves into `.css` files in `packages/ui`,
        each inside its `@layer`: base styles, and the band's styles in the
        folder its component will get.
      - `@bd/ui/styles`: `uiCss()` joins the files, imported as text, in
        layer order.
      - `tokensCss()` writes themed colours with `light-dark()`; the three
        shadows keep three blocks.
      - `@bd/ui/build`: `buildClient()` returns `ui.css` (island modules
        come with `ui-islands`). The local adapter calls it at start and
        serves `/client/ui.css` from memory; `build:local` embeds the
        file; wrangler's build command writes it to
        `apps/web/public/client/`.
      - Every page links `ui.css`; the inline `<style>` goes.
        `apps/web/src/core/style.ts` is deleted, and its tests move with
        the code they check. Class names do not change in this issue.
        `icon.ts` keeps the styles inside the SVG files it draws. The
        `.type-<name>` classes stay generated by the tokens layer.
      - `scripts/exe-smoke.ts`: builds the executable, starts it from an
        empty temporary folder with `BD_SOURCES=fixtures`,
        `READ_SOURCE=fixtures` and `FIXTURE_SET=busy` (never live
        sources: invariant 6), and fetches the paths it is given.
      - `scripts/check-colors.ts` scans `packages/ui/src` outside `tokens`
        as well (`.css`, `.ts` and `.tsx`); today it scans `apps/web/src`
        only.
      - `scripts/cloudflare-smoke.ts` also checks the built bd-web: it
        finds that build beside the pipeline's, so `ci.yml` is unchanged.

      Part of the check: root `package.json` scripts, `packages/ui`'s
      `typecheck` script, a tsconfig for the build area with Bun's types,
      and `.gitignore`. Also changes `apps/web/wrangler.jsonc`.
    acceptance:
      - A test fails when a `.css` file under `packages/ui/src` is missing from `uiCss()`.
      - A test finds the layers in `uiCss()` in the order `tokens, base, primitives, patterns`, each themed colour as one `light-dark()` declaration, and each shadow in all three theme blocks.
      - "`git ls-files 'apps/*.css' 'apps/**/*.css'` prints nothing, `apps/web/src/core/style.ts` no longer exists, and a test finds no `<style` in any rendered page."
      - "The style tests are rewritten against `uiCss()` and the page head, not as matches on minified text: tabular figures, fonts preloaded and never swapped late, no type under 13px, the band's one and two columns. Each is shown failing on a planted violation (a 12px size, a missing preload)."
      - A test plants a literal colour in a `.css` file under `packages/ui/src` outside `tokens`, and `check-colors` reports it.
      - With the verify-local procedure and a browser, the front page shows the dark colours with `data-theme="dark"` set by hand, the light ones with `data-theme="light"`, and the system's choice with neither.
      - "`bun scripts/exe-smoke.ts / /client/ui.css` gets 200 for both, finds the `busy` fixture's edition line in the page and a `@layer` line in the stylesheet; its output is in the PR. Today it gets 404 for the stylesheet."
      - "The Cloudflare smoke run fails when bd-web's front page does not answer 200 with its heading, or when `client/ui.css` is missing from the built assets."

  - id: ui-server-render
    title: Render the site with Preact on the server
    milestone: UI M0 Foundations
    depends_on: [ui-css]
    what: |
      Adopt the renderer of ADR 0020, sections 1 and 3. No client
      JavaScript yet.

      - Add `preact` and `preact-render-to-string`. Set `jsx: react-jsx`
        in `tsconfig.base.json`; every `.tsx` starts with
        `/** @jsxImportSource preact */`; `packages/ui` has a file named
        `tsconfig.json` extending the base, which wrangler's bundler
        reads.
      - `scripts/check-deps.ts`: `preact` and `preact-render-to-string`
        allowed where the record's layers use them, and `preact` in
        `apps/web`.
      - `@bd/ui/runtime`: `Document`, `renderDocument`, `states`, `CLIENT`.
      - `@bd/ui/patterns`: `Band`, moved from `apps/web/src/core/layout.ts`.
        Its classes become `.Band` and `.Band-<part>`, in the markup and
        the CSS together.
      - `apps/web/src/core/routes.ts`: the `URLPattern` route table with
        the `Route`, `RouteResult` and `RouteContext` types of the record.
      - The placeholder page and the bare front page become Preact
        components in `apps/web/src/core/pages`. `escapeHtml` and the
        template strings go.

      Protected path: `AGENTS.md` (architecture map: the renderer and the
      route table). Part of the check: `tsconfig.base.json`,
      `packages/ui/tsconfig.json` and its `typecheck` script,
      `scripts/check-deps.ts` and `bun.lock`. This is the "adopt" half of
      #56; the record is the "choose" half.
    acceptance:
      - 'A test renders a page whose fixture text holds `<script>`, `&` and, in an attribute, `"`; in the output they appear only as `&lt;script>`, `&amp;` and `&quot;`.'
      - The band and page tests are rewritten to assert the same landmarks, ids, headings and text as today; they no longer assert the old escape forms or line breaks.
      - "`grep -rn 'escapeHtml' apps packages --include='*.ts' --include='*.tsx'` prints nothing."
      - "Every tsconfig that reaches a `.tsx` compiles: `bun run typecheck` passes with a page exported from `site.ts`."
      - "`bun test` passes from the repository root, the verify-local procedure with `--fixtures busy` shows the front page, and a test fails on a `.tsx` whose first line is not its JSX pragma."
      - "The Cloudflare smoke run, which fetches bd-web's front page since `ui-css`, passes; with `packages/ui/tsconfig.json` renamed it fails."
      - "`bun scripts/exe-smoke.ts /` still finds the `busy` fixture's edition line and the `Band` class in the page; its output is in the PR."

  - id: ui-islands
    title: Islands and the client modules
    milestone: UI M0 Foundations
    depends_on: [ui-server-render]
    what: |
      ADR 0020, sections 2 and 11.

      - `island()` and `Jsonable` in `@bd/ui/runtime`, and the loader that
        defines `<bd-island>` and reads its `props` attribute.
      - `buildClient()` also returns the loader, one module per
        `*.island.tsx` and the shared chunks.
      - `Document` loads the loader, and holds the constant script that
        applies a stored theme before first paint.
      - One real island proves it end to end: the theme switch of #105, in
        its smallest form (a button that flips `data-theme` and stores the
        choice). #105 then finishes its design.
    acceptance:
      - "A type test, compiled by `bun run typecheck`, shows that a function, a `Date`, a `Map`, a nested callback and `children: ComponentChildren` are compile errors as island props, that `RankRow`, `SiteMeta` and `Edition` are accepted, and that a prop typed `unknown` is rejected."
      - A test renders an island whose prop text holds `</script>`, quotes and `&`; the HTML has no raw `<` inside the attribute and the props read back equal.
      - With the verify-local procedure and a browser, clicking the theme switch on the front page changes the theme, a reload keeps it, and the other theme does not show first; the steps and a screenshot are in the PR.
      - "`bun scripts/exe-smoke.ts /client/loader.js /client/ThemeSwitch.island.js` gets 200 for both; the theme switch is then clicked in a browser against that executable, with a screenshot in the PR."
      - A page with no island requests no JavaScript besides the loader, checked from the browser's network list.

  - id: mail-package
    title: "@bd/mail package with the first React Email template"
    milestone: UI M9 Search, email and snapshots
    depends_on: [ui-server-render]
    what: |
      ADR 0020, section 7. Create `packages/mail` (`@bd/mail`) with React
      and React Email, and the "confirm subscription" template as the
      first one. Values come from `@bd/ui/tokens` as literals (light
      theme, inline styles).

      - Export `renderConfirm(data): Promise<{ html: string; text: string }>`.
        The template's text comes in `data`; the string tables for emails
        live in `apps/pipeline`.
      - Every `.tsx` file starts with `/** @jsxImportSource react */`; the
        pragma test of `ui-server-render` covers this package too.
        `packages/mail` has a file named `tsconfig.json` extending the
        base.
      - `check-deps`: a rule for `packages/mail/src`; only
        `apps/pipeline` may import `@bd/mail`.
      - Choose the React Email import that keeps the Worker bundle small
        (`react-email` 6 or `@react-email/render` with components) and
        record the size in the PR.
      - `scripts/cloudflare-smoke.ts` renders the template in the Workers
        runtime.

      Protected path: `AGENTS.md` (architecture map gains `packages/mail`).
      Part of the check: `scripts/check-deps.ts`, `bun.lock`,
      `packages/mail/package.json` (`typecheck`) and
      `packages/mail/tsconfig.json`. #143 builds the three subscriber
      emails on this.
    acceptance:
      - A test renders the template and finds no `var(` and no web font the text depends on.
      - "A `check-deps` test shows `apps/web` importing `@bd/mail` is reported."
      - "`bun run typecheck` passes with the template imported from the pipeline core, in the pipeline's three tsconfigs and in `apps/local`."
      - The Cloudflare smoke run renders the template in the Workers runtime and fails when the render throws; the pipeline Worker's dry-run size, with the template imported, is in the PR.
      - "A test fails when a `package.json` under `apps/web` or `packages/ui` lists `react` or `react-dom`."
      - A test renders the template with English and with Chinese text in its data, and each rendered email holds that text and none of the other language's.
      - A test fails when a key of the email string table in `apps/pipeline` is missing in an enabled language.

  - id: share-card-engine
    title: "Spike: draw a share card as PNG in Bun and in a Worker"
    milestone: UI M3 Topic page and share cards
    depends_on: [ui-tokens]
    what: |
      ADR 0020, section 8. Find one way to turn an SVG share card with the
      site's fonts into a PNG that works in a compiled Bun executable and
      in the Workers runtime, without a cloud-only service (invariant 8).
      Candidates to measure: `@resvg/resvg-wasm`, satori with it, a native
      module on Bun with wasm on Workers. Include one card with Chinese
      text. Report the size added to each bundle and the time to draw one
      card. The answer goes in the issue and closes it; no product code is
      merged.
    acceptance:
      - A throwaway script draws the same 1200x630 card, with Fraunces text and one with Chinese text, in a compiled Bun executable and in Miniflare, and the PNGs are compared.
      - "The answer names the engine, the bundle size it adds to each side and the draw time, or says that no candidate works and what that means for #129."
