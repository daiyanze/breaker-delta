<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
<style>
body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;font-variant-numeric:tabular-nums}
.fr{font-family:var(--font-display)}
.sm{font-size:15px;color:var(--ink-2)}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
a{color:inherit;text-decoration:none}
.kd{display:inline-flex;align-items:center;border:2px solid var(--ink);font-weight:700;font-size:15px;padding:1px 10px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:600 17px var(--font-body);cursor:pointer}
</style>
</head>
<body>
<style>.tabs{display:flex;flex-wrap:wrap;border-bottom:4px solid var(--ink)}.tabs button{min-height:52px;padding:0 20px;border:0;background:none;font:600 17px var(--font-body);color:var(--ink-2)}.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}.set{display:flex;gap:24px;align-items:center;min-height:44px;padding:12px 0;border-bottom:1px solid var(--hair)}.set select{min-height:44px;padding:0 12px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font:500 15px var(--font-body);margin-left:auto}</style>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true">Settings</button><button role="tab">Verdicts</button><button role="tab">Topics</button><button role="tab">Corrections</button><button role="tab">Scans</button></div>
<div class="set"><span><strong>Who can open the desk</strong><br><span class="sm">Anyone who reaches this address is asked to sign in first.</span></span><select aria-label="Sign-in method"><option>This computer only</option><option>Password</option><option selected>Cloudflare Access</option><option>Sign-in proxy</option></select></div>
<div class="set"><span><strong>Language of the desk</strong><br><span class="sm">Changes this page only. The public site has one page per language.</span></span><select aria-label="Language"><option selected>English</option><option>中文</option><option>日本語</option></select></div>
</body>
</html>
