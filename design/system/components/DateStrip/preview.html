<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
<style>
body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;font-variant-numeric:tabular-nums}
.fr{font-family:var(--font-display)}
.sm{font-size:15px;color:var(--ink-2)}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div class="row" style="align-items:center;gap:20px">
<span style="display:flex;align-items:center;gap:14px"><span style="width:52px;border:1.5px solid var(--ink);display:flex;flex-direction:column;text-align:center;transform:rotate(-4deg);background:var(--paper);box-shadow:var(--shadow-paper)"><span style="background:var(--red);color:var(--paper);font-size:13px;font-weight:700;line-height:1.5">Nov</span><span class="fr" style="font-size:27px;font-weight:900;line-height:1.15">19</span></span><span style="display:flex;flex-direction:column;line-height:1.35"><strong>Thursday, November 19, 2026</strong><span class="sm">Vol. 2, No. 323. Sea state: choppy.</span></span></span>
<span style="background:var(--sun);color:var(--on-sun);padding:6px 14px;transform:rotate(-2deg);display:flex;flex-direction:column;line-height:1.25;box-shadow:var(--shadow-paper)"><strong class="fr" style="font-size:20px;font-weight:900">16 waves up</strong><span style="font-size:13px;font-weight:600">5 new today, scanned 14:00</span></span>
</div>
</body>
</html>
