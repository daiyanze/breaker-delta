<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
<style>
body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;font-variant-numeric:tabular-nums}
.fr{font-family:var(--font-display)}
.sm{font-size:15px;color:var(--ink-2)}

</style>
</head>
<body>
<div class="row" style="gap:20px"><svg viewBox="0 0 120 220" style="width:92px;height:168px" role="img" aria-label="12 layers"><g id="s"></g><path d="M2,214 H118" style="stroke:var(--ink);stroke-width:2.5;stroke-linecap:round"/></svg><span class="fr" style="font-size:132px;font-weight:900;line-height:.74;letter-spacing:-.05em;color:var(--red)">196</span></div>
<script>(function(){var g=document.getElementById('s'),h='';for(var k=0;k<12;k++){var w=Math.round(100-k*5.6),cx=54+k*1.6;h+='<rect x="'+(cx-w/2)+'" y="'+(212-(k+1)*14+1)+'" width="'+w+'" height="11" rx="5.5" style="fill:var('+(k===11?'--red':(k%2?'--sky':'--blue'))+')"/>';}g.innerHTML=h;})();</script>
</body>
</html>
