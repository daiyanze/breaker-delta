<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
<style>
body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;font-variant-numeric:tabular-nums}
.fr{font-family:var(--font-display)}
.sm{font-size:15px;color:var(--ink-2)}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
a{color:inherit;text-decoration:none}
.kd{display:inline-flex;align-items:center;border:2px solid var(--ink);font-weight:700;font-size:15px;padding:1px 10px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:600 17px var(--font-body);cursor:pointer}
</style>
</head>
<body>
<style>.s{display:grid;grid-template-columns:36px 1.2fr 2fr 60px 1fr;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--hair)}.t{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center}.bar{height:12px;background:var(--hair)}.bar b{display:block;height:12px;background:var(--blue)}</style>
<div class="s"><span class="t" style="background:var(--ink);color:var(--paper)"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 4 H15 M3 9 H15 M3 14 H10" style="fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round"/></svg></span><strong>Wire service</strong><span class="bar"><b style="width:92%"></b></span><span>412</span><span>Healthy</span></div>
<div class="s"><span class="t"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 4 H15 V12 H8 L5 15 V12 H3 Z" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"/></svg></span><strong>Forum</strong><span class="bar"><b style="width:55%"></b></span><span>246</span><span>Slow</span></div>
<div class="s"><span class="t"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M6.5 5 L2.5 9 L6.5 13 M11.5 5 L15.5 9 L11.5 13" style="fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"/></svg></span><strong>Code host</strong><span class="bar"><b style="width:18%"></b></span><span>81</span><span style="color:var(--red);font-weight:600">Failing since 11:00</span></div>
</body>
</html>
