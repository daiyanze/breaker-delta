<style>

<style>.ed{position:relative;width:78px;height:100px;padding:9px 9px 8px;box-sizing:border-box;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);display:flex;flex-direction:column;gap:6px;align-items:flex-start;box-shadow:var(--shadow-paper)}.ed b{display:block;height:5px;background:currentColor}.on{background:var(--sun);color:var(--on-sun);border-color:var(--on-sun);transform:translateY(-9px) rotate(-3deg);box-shadow:var(--shadow-picked)}.ghost{border:2px dashed var(--ink-2);color:var(--ink-2);box-shadow:none;background:none}</style>
<div class="row" style="padding-top:14px;gap:18px">
<div class="ed"><span class="fr" style="font-size:18px;font-weight:800;line-height:1">13:00</span><b style="width:97%;height:7px"></b><b style="width:89%"></b><b style="width:84%;height:4px"></b><span style="margin-top:auto;font-size:13px;font-weight:600">15 up</span></div>
<div class="ed on"><span class="fr" style="font-size:18px;font-weight:800;line-height:1">14:00</span><b style="width:98%;height:7px"></b><b style="width:90%"></b><b style="width:85%;height:4px"></b><span style="margin-top:auto;font-size:13px;font-weight:600">16 up</span></div>
<div class="ed ghost"><span class="fr" style="font-size:18px;font-weight:800;line-height:1">15:00</span><span style="margin-top:auto;font-size:13px;font-weight:600;line-height:1.2">in 31 min</span></div>
</div>
