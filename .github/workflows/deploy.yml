name: deploy

# Deploys run only after merge to develop (the default branch), in the protected `production`
# environment (set required reviewers on it in repository settings).
# Claude jobs never have access to this environment's secrets.
#
# The `production` environment must require the owner's review and allow only
# `develop`. Approving the deployment is approving the migrations it applies:
# a migration cannot be undone (ADR 0019, "Deploys").

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Apply migrations
        working-directory: apps/pipeline
        run: bunx wrangler d1 migrations apply bd-content --remote
      # Contract changes: pipeline first, then web.
      - name: Deploy pipeline
        working-directory: apps/pipeline
        run: bunx wrangler deploy
      - name: Deploy web
        working-directory: apps/web
        run: bunx wrangler deploy
