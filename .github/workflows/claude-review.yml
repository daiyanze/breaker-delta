name: claude-review

# Guardrails: docs/adr/0007-claude-automation-guardrails.md
# - Runs only for the repository owner and only for branches of this repo.
# - Never uses pull_request_target. Fork PRs get no secrets and no Claude.
# - For a PR opened by another workflow, the owner adds the `claude-review`
#   label to trigger this.
#
# OFF by default (ADR 0016: development runs on a local agent). To turn it on,
# add a model secret and set the repository variable CLAUDE_REVIEW to `on`.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      vars.CLAUDE_REVIEW == 'on' &&
      github.actor == 'daiyanze' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          # Use exactly one of the two credentials.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow .claude/skills/cross-examine/SKILL.md exactly. Read AGENTS.md first.
            Write the comment to /tmp/bd-review.md, the only file you may write.
            Post it with `gh pr comment <n> --body-file /tmp/bd-review.md` and read it
            back with `gh pr view <n> --json comments --jq '.comments[-1].body'`. If it
            came back altered, fix it in place with
            `gh pr comment <n> --edit-last --body-file /tmp/bd-review.md`. Do not push commits.
          # The action runs in auto mode unless told otherwise, and in auto mode
          # --allowedTools is not a limit. Default mode makes it one: the session
          # can do only what is listed, and anything else is refused.
          claude_args: |
            --permission-mode default
            --allowedTools "Read,Grep,Glob,Edit(//tmp/bd-review.md),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
