# Release: build every distributable artifact and publish a GitHub
# Release. Trigger by pushing a version tag:
#
#   git tag v0.22.0 && git push origin v0.22.0
#
# The tag version must match the engine version in package.json
# (scripts/release.mjs verifies all version stamps and aborts on any
# mismatch). A manual workflow_dispatch run only builds the assets and
# uploads them as a workflow artifact — it never creates a Release,
# which makes it a safe dry run.
#
# Assets (built by scripts/release.mjs into release-dist/):
#   breaker-delta-<version>.mjs          single-file CLI
#   breaker-delta-skill-<version>.zip    Agent Skill + CLI bundle
#   breaker-delta-extension-<ext>.zip    Chrome extension (own version)
#   SHA256SUMS.txt                       checksums

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - run: bun install --frozen-lockfile

      - name: Test, build and stage release assets
        run: bun scripts/release.mjs --version "${{ steps.version.outputs.version }}"

      - name: Upload assets as workflow artifact (dry-run access)
        uses: actions/upload-artifact@v4
        with:
          name: breaker-delta-${{ steps.version.outputs.version }}
          path: |
            release-dist/*.mjs
            release-dist/*.zip
            release-dist/SHA256SUMS.txt
            release-dist/RELEASE_NOTES.md
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            release-dist/*.mjs release-dist/*.zip release-dist/SHA256SUMS.txt \
            --title "Breaker Delta v${{ steps.version.outputs.version }}" \
            --notes-file release-dist/RELEASE_NOTES.md
