name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # No Node on this machine (#13): delete the runner's preinstalled
      # copy, so anything that still reaches for it fails here.
      - name: Remove Node
        run: |
          for bin in node npm npx corepack; do
            while command -v "$bin" >/dev/null; do sudo rm -f "$(command -v "$bin")"; hash -r; done
          done
          ! command -v node
      - run: bun install --frozen-lockfile
      - run: bun run check

  # The Cloudflare adapter (ADR 0018, #173): build both Workers without an
  # account, then run the built pipeline in the Workers runtime (miniflare).
  # Kept out of `check` so local development never needs Cloudflare tooling.
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # No Node on this machine (#13): delete the runner's preinstalled
      # copy, so anything that still reaches for it fails here.
      - name: Remove Node
        run: |
          for bin in node npm npx corepack; do
            while command -v "$bin" >/dev/null; do sudo rm -f "$(command -v "$bin")"; hash -r; done
          done
          ! command -v node
      - run: bun install --frozen-lockfile
      # `--bun` runs wrangler on Bun instead of the `node` in its shebang.
      - name: Build both Workers (dry run)
        run: |
          (cd apps/pipeline && bun x --bun wrangler deploy --dry-run --outdir ../../.wrangler-dist/pipeline)
          (cd apps/web && bun x --bun wrangler deploy --dry-run --outdir ../../.wrangler-dist/web)
      - name: Run the built pipeline in the Workers runtime
        run: bun scripts/cloudflare-smoke.ts .wrangler-dist/pipeline
