name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.2"
      - run: bun install
      - run: bun run build
      - run: bun run test
      - name: Import boundaries
        run: bun scripts/check-boundaries.mjs --strict
