name: preview

# Per-PR preview of both Workers. UNVERIFIED and DISABLED: `wrangler preview`
# and its config are to be confirmed in M0. Before enabling:
#   - bind previews to a separate, seeded D1 (bd-content-preview). Previews do
#     NOT isolate D1 automatically and would otherwise use production data.
#   - disable cron and workflows in previews.
#   - protect preview URLs with Cloudflare Access.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Preview web
        working-directory: apps/web
        run: bunx wrangler preview --name pr-${{ github.event.pull_request.number }}
