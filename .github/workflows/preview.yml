name: preview

# Per-PR previews of both Workers (#11), with `wrangler preview`.
#
# - Bindings: a Preview gets only the bindings in each wrangler.jsonc's
#   `previews` block: bd-content-preview and bd-blobs-preview, never
#   production (checked by scripts/wrangler-previews.test.ts in `check`).
# - Timer: Previews never get cron triggers; the pipeline's cron runs only on
#   the production deployment. No secrets are uploaded, so /__probe and
#   /__tick do not exist in a preview.
# - Access: preview URLs are behind Cloudflare Access, turned on by the owner
#   in the dashboard for workers.dev and Preview URLs of both Workers
#   (docs/development.md, "Previews"). The `access` step fails the job if an
#   unauthenticated request gets through.
# - Credentials: the `preview` environment holds a token separate from the
#   deploy job's and the local agent's (ADR 0019). Only same-repository PRs
#   opened by the owner run this job; forks never get the secrets (ADR 0007).
# - The preview database is shared by every open PR. Migrations only add, so a
#   PR that adds one leaves the others' previews working.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'daiyanze'
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # `--bun` runs wrangler on Bun instead of the `node` in its shebang (ADR 0018).
      - name: Apply migrations to the preview database
        working-directory: apps/pipeline
        run: bun x --bun wrangler d1 migrations apply bd-content-preview --remote -c wrangler.preview-db.jsonc
      # --ignore-base-config: no bindings from the dashboard's Preview base config.
      - name: Preview pipeline
        working-directory: apps/pipeline
        run: bun x --bun wrangler preview --name "$NAME" --ignore-base-config --json > ../../pipeline.json
      - name: Preview web
        working-directory: apps/web
        run: bun x --bun wrangler preview --name "$NAME" --ignore-base-config --json > ../../web.json
      - name: Preview URLs
        id: urls
        run: |
          for app in pipeline web; do
            # The JSON is the last thing wrangler prints; skip any log line before it.
            url="$(sed -n '/^{/,$p' "$app.json" | jq -r '(.preview.urls // [])[0] // (.deployment.urls // [])[0] // empty')"
            if [ -z "$url" ]; then echo "no preview URL for $app"; exit 1; fi
            echo "$app=$url" >> "$GITHUB_OUTPUT"
          done
      # Unauthenticated access must be blocked: Access answers with a redirect
      # to its login page (302) or 403, never the Worker's 200.
      - name: Access blocks unauthenticated requests
        env:
          PIPELINE: ${{ steps.urls.outputs.pipeline }}
          WEB: ${{ steps.urls.outputs.web }}
        run: |
          for url in "$PIPELINE/health" "$WEB/health"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            echo "$url -> $code"
            if [ "$code" = 200 ]; then echo "preview is not behind Cloudflare Access"; exit 1; fi
          done
      - name: Comment the URLs on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PIPELINE: ${{ steps.urls.outputs.pipeline }}
          WEB: ${{ steps.urls.outputs.web }}
        run: |
          printf '%s\n' "Preview for ${SHA::7} (Cloudflare Access sign-in required):" "" \
            "- web: $WEB" "- pipeline: $PIPELINE" "" \
            "Bound to bd-content-preview and bd-blobs-preview. No cron." > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none

  # A closed PR's previews are deleted. The preview database is shared and kept.
  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'daiyanze'
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Delete previews
        run: |
          for app in pipeline web; do
            (cd "apps/$app" && bun x --bun wrangler preview delete --name "$NAME" --skip-confirmation)
          done
