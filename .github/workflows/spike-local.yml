name: spike-local

# Spike 1 (docs/spikes/m0.md): does `bun run local` work on each OS with no
# Cloudflare account? Linux runs it with no network at all. Kept as a smoke
# test for local mode; it moves to the native executable from ADR 0018 once
# that exists.

on:
  pull_request:
    paths:
      - apps/local/**
      - apps/pipeline/**
      - apps/web/**
      - packages/**
      - scripts/spike-local.ts
      - .github/workflows/spike-local.yml
      - bun.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # No Node on this machine (#13): delete the runner's preinstalled
      # copy, so anything that still reaches for it fails here.
      - name: Remove Node
        if: runner.os != 'Windows'
        run: |
          for bin in node npm npx corepack; do
            while command -v "$bin" >/dev/null; do sudo rm -f "$(command -v "$bin")"; hash -r; done
          done
          ! command -v node
      - run: bun install --frozen-lockfile

      - name: Spike, offline (Linux)
        if: runner.os == 'Linux'
        # A fresh network namespace has only a loopback interface: nothing
        # can reach Cloudflare or anything else.
        run: |
          sudo unshare --net -- env "PATH=$PATH:/usr/sbin:/sbin" "HOME=$HOME" "RUN_AS=$USER" sh -c '
            ip link set lo up
            exec sudo -u "$RUN_AS" env "PATH=$PATH" "HOME=$HOME" bun scripts/spike-local.ts
          '

      - name: Spike (macOS, Windows)
        if: runner.os != 'Linux'
        run: bun scripts/spike-local.ts
