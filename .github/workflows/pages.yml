# The live site moved to the instance data repo (daiyanze/breaker-delta-data)
# on 2026-11-15 when data and engine were split into separate repos.
# This workflow now deploys only a redirect page to the new address.
# Other instances: delete this workflow in your engine fork and let your
# own data repo build and deploy your site.
name: pages-redirect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect page
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="zh">
          <head>
          <meta charset="utf-8">
          <title>浪尖雷达已搬家 · Breaker Delta moved</title>
          <meta http-equiv="refresh" content="0; url=https://daiyanze.github.io/breaker-delta-data/">
          <link rel="canonical" href="https://daiyanze.github.io/breaker-delta-data/">
          </head>
          <body>
          <p>浪尖雷达 / Breaker Delta 已搬到
          <a href="https://daiyanze.github.io/breaker-delta-data/">daiyanze.github.io/breaker-delta-data</a>，
          正在为你跳转…</p>
          </body>
          </html>
          HTML
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
