name: evals

# The eval (#50): run every shipped prompt over the committed cases in
# evals/cases/ (synthetic only: no fetched text) through the provider chains
# in evals/providers.json, and post the result on the PR. See evals/README.md.
#
# - When: a PR that changes a prompt, the judge, the eval, its cases or
#   providers, the pipeline's checks it scores with, or this file.
# - Credentials: the `evals` environment holds the provider keys named in
#   evals/providers.json (GROQ_API_KEY, GEMINI_API_KEY, OPENCODE_GO_API_KEY).
#   A provider whose key is not set is left out; a shipped prompt with no
#   provider left fails the job, and the comment says which key to set. Only same-repository PRs
#   opened by the owner run this job; forks never get the keys (ADR 0007).
# - The comment holds numbers, prompt versions and provider names only, never
#   a model answer or case text (invariant 6: a coding session reads it).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - packages/judge/**
      - packages/contracts/src/model.ts
      - apps/pipeline/src/core/assign.ts
      - apps/pipeline/src/core/model.ts
      - apps/pipeline/src/core/validate.ts
      - evals/**
      - scripts/eval*.ts
      - .github/workflows/evals.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: evals-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eval:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'daiyanze'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: evals
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run the eval
        id: eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=0
          bun scripts/eval.ts --sha "$SHA" --report eval.md --json eval.json || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ ! -s eval.md ]; then
            printf '%s\n' "<!-- bd-evals -->" "### Eval for ${SHA::7}" "" "The eval could not run (exit $code); see the job log." > eval.md
          fi
          cat eval.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the result on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Update this job's own comment: the marker, posted by this workflow's
          # bot. Anyone can post a comment that starts with the marker.
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- bd-evals -->"))) | .id' | tail -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@eval.md >/dev/null
          else
            gh pr comment "$PR" --body-file eval.md
          fi
      - name: Fail when a shipped prompt was not evaluated
        if: steps.eval.outputs.code != '0'
        env:
          CODE: ${{ steps.eval.outputs.code }}
        run: |
          echo "eval exited $CODE: a shipped prompt has no cases or no provider key (see the comment)"
          exit 1
