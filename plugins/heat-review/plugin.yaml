id: heat-review
api: 1
order: 45
name:
  zh: "热度复核"
  en: "Heat Review"
  ja: "熱度レビュー"
description:
  zh: "复核指标代码插件：14 天复核到期时，按话题在期内的再次出现与浪高走势给出 hit/miss 判定与证据（出现 ≥3 次、或再现且浪高不降 = hit；只出现一次、或再现但浪高跌落 = miss）。机制（到期、登记、留痕）仍归引擎。"
  en: "Review-metric code plugin: at the 14-day review, judges hit/miss from the topic's own reappearances and heat trend (3+ appearances, or a reappearance without heat loss = hit; a single appearance, or a reappearance with falling heat = miss). The mechanism (due dates, recording, audit trail) stays the engine's."
  ja: "レビュー指標コードプラグイン：14 日レビュー時に話題の再出現と浪高の推移から hit/miss を判定する（3 回以上出現、または再出現して浪高が落ちなければ hit；1 回のみ、または再出現しても下落なら miss）。仕組み（期限・記録・痕跡）はエンジン側に残る。"
slots:
  - review
entry: plugin.ts
