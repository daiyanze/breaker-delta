# Structured grading output stored at edition item plugins.investor.
fields:
  - name: direction
    type: enum
    values: [利好, 利空, 中性, 不明]
    required: true
  - name: tickers
    type: list
    of: string
    note: "代码 + 名称，如 \"NVDA 英伟达\"；可多个，没有明确标的留空"
  - name: horizon
    type: enum
    values: [事件驱动, 季度, 长期]
    required: true
  - name: logic
    type: string
    required: true
    note: "一句话：为什么这个话题会影响这些标的"
  - name: risks
    type: string
    required: true
    note: "一句话：最大的风险或反证是什么"
