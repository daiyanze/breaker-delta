<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>浪尖雷达 · 收波 — 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <img class="logo" src="icons/icon48.png" alt="" width="40" height="40">
      <div>
        <h1>浪尖雷达 · 收波 — 设置</h1>
        <p class="subtitle">Breaker Delta Echo Catcher Settings</p>
      </div>
    </header>

    <section>
      <h2>投波目标</h2>
      <label class="field">
        <span>数据仓（GitHub owner/repo）</span>
        <input id="data-repo" type="text" spellcheck="false" placeholder="daiyanze/breaker-delta-data">
        <small>点「投波」时，会在这个仓库打开一个预填好的 Issue：标题、正文、标签都自动填好，你只需点提交。不需要任何令牌。</small>
      </label>
      <label class="field">
        <span>实例站点地址</span>
        <input id="site-base" type="text" spellcheck="false" placeholder="https://daiyanze.github.io/breaker-delta-data/">
        <small>话题页链接和话题/破圈数据的来源。用自己实例的人改成自己的站点地址即可。</small>
      </label>
    </section>

    <section>
      <h2>投波行为</h2>
      <label class="check">
        <input id="open-after-capture" type="checkbox">
        <span>收波后立即打开投波页（一键直达 GitHub Issue）</span>
      </label>
      <label class="check">
        <input id="keep-local" type="checkbox">
        <span>投波后保留本地回波箱里的副本（关掉则打开投波页后即删除本地那条）</span>
      </label>
    </section>

    <section>
      <h2>数据</h2>
      <p id="data-info" class="data-info">正在读取数据状态…</p>
      <button id="refresh-data" type="button">立即从实例站点刷新数据</button>
      <small class="block-note">扩展会在启动时从实例站点拉取最新话题/破圈数据并缓存在本地；拉不到时自动用扩展自带的快照。</small>
    </section>

    <div class="actions">
      <button id="save" class="primary" type="button">保存设置</button>
      <button id="reset" type="button">恢复默认</button>
    </div>
    <p id="status" class="status" role="status"></p>

    <footer>
      <p>🔒 隐私：只在你主动点击时读取当前页，不收集浏览历史；设置和回波只存本地（chrome.storage.local）。投波只是打开一个预填好的 GitHub 页面，提交动作由你在 GitHub 上完成。</p>
    </footer>
  </main>
  <script src="options.js"></script>
</body>
</html>
